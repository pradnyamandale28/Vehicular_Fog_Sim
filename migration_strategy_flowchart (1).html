<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration Strategy Decision Flow</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #flowchart {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .shape-text {
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .bold-text {
            font-weight: bold;
        }
        .italic-text {
            font-style: italic;
        }
        .arrow-label {
            font-size: 10px;
            fill: #333;
        }
        .annotation-text {
            font-size: 8px;
            fill: #666;
        }
        .legend-text {
            font-size: 9px;
            fill: #333;
        }
        .bullet-text {
            font-size: 9px;
            fill: #333;
            text-anchor: start;
        }
    </style>
</head>
<body>
    <svg id="flowchart" width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead markers -->
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#000"/>
            </marker>
            <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#27AE60"/>
            </marker>
            <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#E74C3C"/>
            </marker>
            <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#E67E22"/>
            </marker>
            <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#9B59B6"/>
            </marker>
        </defs>
        
        <!-- Title -->
        <text x="500" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
            Migration Strategy Decision Flow
        </text>
        
        <!-- STEP 1: Trigger Event -->
        <rect x="350" y="80" width="300" height="80" rx="15" fill="#E8F4F8" stroke="#2E86AB" stroke-width="2"/>
        <text x="500" y="120" font-size="14" font-weight="bold" class="shape-text">Vehicle Movement Detected</text>
        
        <!-- Arrow 1 -->
        <line x1="500" y1="160" x2="500" y2="200" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
        
        <!-- STEP 2: Urgency Calculation (Parallelogram) -->
        <path d="M 340 200 L 660 200 L 680 270 L 320 270 Z" fill="#FFF9E3" stroke="#F39C12" stroke-width="2"/>
        <text x="500" y="225" font-size="14" font-weight="bold" class="shape-text">Calculate Urgency Score (U<tspan baseline-shift="sub" font-size="10">i</tspan>)</text>
        <text x="500" y="250" font-size="11" font-style="italic" class="shape-text">U<tspan baseline-shift="sub" font-size="9">i</tspan> = α·d<tspan baseline-shift="sub" font-size="9">i</tspan> + β·c<tspan baseline-shift="sub" font-size="9">i</tspan> + γ·h<tspan baseline-shift="sub" font-size="9">i</tspan> + δ·l<tspan baseline-shift="sub" font-size="9">j</tspan></text>
        
        <!-- Annotation 1 -->
        <line x1="680" y1="235" x2="730" y2="235" stroke="#999" stroke-width="1"/>
        <rect x="730" y="205" width="240" height="60" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
        <text x="850" y="225" class="annotation-text" text-anchor="middle">4 weighted factors: deadline,</text>
        <text x="850" y="238" class="annotation-text" text-anchor="middle">criticality, handoff risk,</text>
        <text x="850" y="251" class="annotation-text" text-anchor="middle">fog load</text>
        
        <!-- Arrow 2 -->
        <line x1="500" y1="270" x2="500" y2="315" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
        
        <!-- STEP 3: Decision Diamond 1 (Is Ui > 0.7?) -->
        <path d="M 500 315 L 640 385 L 500 455 L 360 385 Z" fill="#FFE5CC" stroke="#E67E22" stroke-width="2"/>
        <text x="500" y="380" font-size="14" font-weight="bold" class="shape-text">Is U<tspan baseline-shift="sub" font-size="11">i</tspan> > 0.7?</text>
        
        <!-- NO path (left) -->
        <line x1="360" y1="385" x2="200" y2="385" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowhead-red)"/>
        <text x="280" y="375" class="arrow-label" font-weight="bold" fill="#E74C3C">NO</text>
        
        <!-- Terminal box (Continue on Current Fog Node) -->
        <rect x="50" y="355" width="250" height="60" rx="10" fill="#E8E8E8" stroke="#95A5A6" stroke-width="2"/>
        <text x="175" y="385" font-size="12" class="shape-text">Continue on Current Fog Node</text>
        
        <!-- YES path (down) -->
        <line x1="500" y1="455" x2="500" y2="500" stroke="#27AE60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
        <text x="520" y="477" class="arrow-label" font-weight="bold" fill="#27AE60">YES</text>
        
        <!-- STEP 4: Prediction -->
        <rect x="350" y="500" width="300" height="70" rx="15" fill="#F0E6FF" stroke="#9B59B6" stroke-width="2"/>
        <text x="500" y="525" font-size="14" font-weight="bold" class="shape-text">Predict Next Fog Node</text>
        <text x="500" y="548" font-size="10" class="shape-text">Using Random Forest Classifier</text>
        
        <!-- Arrow 3 -->
        <line x1="500" y1="570" x2="500" y2="615" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
        
        <!-- STEP 5: Decision Diamond 2 (Is Current Fog Saturated?) -->
        <path d="M 500 615 L 660 700 L 500 785 L 340 700 Z" fill="#E8F8E8" stroke="#27AE60" stroke-width="2"/>
        <text x="500" y="685" font-size="13" font-weight="bold" class="shape-text">Is Current Fog</text>
        <text x="500" y="703" font-size="13" font-weight="bold" class="shape-text">Saturated?</text>
        <text x="500" y="721" font-size="11" font-style="italic" class="shape-text">(load > 0.85)</text>
        
        <!-- Arrow paths to strategy boxes -->
        
        <!-- Path to UCM (Far left - Low Urgency) -->
        <path d="M 340 700 Q 200 700 200 850" stroke="#E74C3C" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
        <text x="250" y="770" class="arrow-label" fill="#E74C3C">Low Urgency</text>
        
        <!-- Path to RCM (Medium Urgency) -->
        <path d="M 400 732 Q 380 790 420 850" stroke="#E67E22" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>
        <text x="340" y="800" class="arrow-label" fill="#E67E22">Medium Urgency</text>
        
        <!-- Path to PCM (High Urgency + Prediction) -->
        <line x1="500" y1="785" x2="500" y2="850" stroke="#27AE60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
        <text x="430" y="820" class="arrow-label" fill="#27AE60">High Urgency + Prediction</text>
        
        <!-- Path to SCM (Saturated - Right) -->
        <path d="M 660 700 Q 720 700 720 850" stroke="#9B59B6" stroke-width="3" fill="none" marker-end="url(#arrowhead-purple)"/>
        <text x="660" y="770" class="arrow-label" fill="#9B59B6">Fog Saturated</text>
        
        <!-- STRATEGY BOXES (Bottom Row) -->
        
        <!-- BOX 1: UCM (Far Left) -->
        <rect x="100" y="850" width="200" height="120" fill="#FFE6E6" stroke="#E74C3C" stroke-width="3"/>
        <text x="200" y="875" font-size="16" font-weight="bold" class="shape-text" fill="#E74C3C">UCM</text>
        <text x="200" y="895" font-size="10" class="shape-text">Urgency-Aware Chain Migration</text>
        <text x="120" y="925" class="bullet-text">• Migrate full SFC</text>
        <text x="120" y="940" class="bullet-text">• Baseline approach</text>
        <text x="120" y="955" class="bullet-text">• High overhead</text>
        
        <!-- BOX 2: RCM -->
        <rect x="320" y="850" width="200" height="120" fill="#FFF0E6" stroke="#E67E22" stroke-width="3"/>
        <text x="420" y="875" font-size="16" font-weight="bold" class="shape-text" fill="#E67E22">RCM</text>
        <text x="420" y="895" font-size="10" class="shape-text">Residual Chain Migration</text>
        <text x="340" y="925" class="bullet-text">• Migrate residual only</text>
        <text x="340" y="940" class="bullet-text">• 50% overhead reduction</text>
        <text x="340" y="955" class="bullet-text">• Reactive</text>
        
        <!-- BOX 3: PCM (BEST - Highlighted) -->
        <rect x="540" y="850" width="200" height="120" fill="#E8F8E8" stroke="#27AE60" stroke-width="4"/>
        <!-- BEST Badge -->
        <rect x="710" y="855" width="50" height="25" rx="5" fill="#27AE60"/>
        <text x="735" y="870" font-size="11" font-weight="bold" class="shape-text" fill="white">BEST</text>
        
        <text x="640" y="875" font-size="16" font-weight="bold" class="shape-text" fill="#27AE60">PCM</text>
        <text x="640" y="895" font-size="10" class="shape-text">Predictive Chain Migration</text>
        <text x="560" y="925" class="bullet-text">• Pre-instantiate VNFs</text>
        <text x="560" y="940" class="bullet-text">• 90% overhead reduction</text>
        <text x="560" y="955" class="bullet-text">• Proactive</text>
        
        <!-- Annotation 2 (PCM recommended) -->
        <line x1="740" y1="900" x2="790" y2="900" stroke="#999" stroke-width="1"/>
        <rect x="790" y="880" width="190" height="40" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
        <text x="885" y="895" class="annotation-text" text-anchor="middle">Recommended for</text>
        <text x="885" y="908" class="annotation-text" text-anchor="middle">safety-critical applications</text>
        
        <!-- BOX 4: SCM (Far Right) -->
        <rect x="760" y="850" width="200" height="120" fill="#F0E6FF" stroke="#9B59B6" stroke-width="3"/>
        <text x="860" y="875" font-size="16" font-weight="bold" class="shape-text" fill="#9B59B6">SCM</text>
        <text x="860" y="895" font-size="10" class="shape-text">Split Chain Migration</text>
        <text x="780" y="925" class="bullet-text">• Split across 2 fogs</text>
        <text x="780" y="940" class="bullet-text">• Load balancing</text>
        <text x="780" y="955" class="bullet-text">• Saturation handling</text>
        
    </svg>
</body>
</html>
